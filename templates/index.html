<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NovaChat — Assistant IA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container py-4 py-md-5">
    <div class="chat-shell mx-auto shadow-lg">
      <header class="chat-header d-flex align-items-center justify-content-between gap-2">
        <div class="d-flex align-items-center gap-3"><div class="avatar">✦</div><div><h1 class="h5 mb-0">NovaChat</h1><small>Assistant IA · Démonstration</small></div></div>
        <button id="clear" class="btn btn-sm btn-outline-light" type="button">Effacer</button>
      </header>
      <section id="messages" class="messages" aria-label="Conversation" aria-live="polite">
        <div class="bubble assistant">Bonjour ! Je suis NovaChat. Comment puis-je vous aider aujourd'hui ?</div>
      </section>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <form id="chat-form" class="chat-form d-flex gap-2">
        <label class="visually-hidden" for="message">Votre message</label>
        <input id="message" class="form-control" placeholder="Écrivez votre message..." maxlength="2000" autocomplete="off" required>
        <button id="send" class="btn btn-primary" type="submit">Envoyer</button>
      </form>
      <footer>Prototype pédagogique · Les réponses IA peuvent contenir des erreurs.</footer>
    </div>
  </main>
  <script src="/static/script.js"></script>
</body>
</html>
